<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#fbfbf7"/>
  <rect x="10" y="10" width="780" height="400" fill="none" stroke="#1b1b18" stroke-width="1.5"/>
  <rect x="700" y="330" width="80" height="70" fill="none" stroke="#1b1b18" stroke-width="1"/>
  <text x="740" y="355" font-family="monospace" font-size="13" fill="#1b1b18" text-anchor="middle">FIG. 01</text>
  <text x="740" y="375" font-family="monospace" font-size="10" fill="#6b6b66" text-anchor="middle">LAMP FBD</text>
  <text x="740" y="392" font-family="monospace" font-size="10" fill="#6b6b66" text-anchor="middle">SCALE: NTS</text>

  <!-- wall -->
  <line x1="120" y1="80" x2="120" y2="330" stroke="#1b1b18" stroke-width="3"/>
  <line x1="120" y1="90" x2="95" y2="115" stroke="#1b1b18" stroke-width="1"/>
  <line x1="120" y1="125" x2="95" y2="150" stroke="#1b1b18" stroke-width="1"/>
  <line x1="120" y1="160" x2="95" y2="185" stroke="#1b1b18" stroke-width="1"/>
  <line x1="120" y1="195" x2="95" y2="220" stroke="#1b1b18" stroke-width="1"/>
  <line x1="120" y1="230" x2="95" y2="255" stroke="#1b1b18" stroke-width="1"/>
  <line x1="120" y1="265" x2="95" y2="290" stroke="#1b1b18" stroke-width="1"/>

  <!-- arm -->
  <line x1="120" y1="140" x2="620" y2="140" stroke="#1b1b18" stroke-width="4"/>
  <circle cx="120" cy="140" r="9" fill="#fbfbf7" stroke="#1b1b18" stroke-width="2.5"/>
  <circle cx="120" cy="140" r="2.5" fill="#1b1b18"/>

  <!-- load W at tip -->
  <line x1="620" y1="140" x2="620" y2="230" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="636" y="200" font-family="monospace" font-size="16" fill="#1d4ed8">W = 12 N</text>

  <!-- reaction moment -->
  <path d="M 160 110 A 55 55 0 0 1 168 172" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="95" font-family="monospace" font-size="15" fill="#1d4ed8">M<tspan dy="4" font-size="11">A</tspan></text>

  <!-- dimension line -->
  <line x1="120" y1="300" x2="620" y2="300" stroke="#6b6b66" stroke-width="1"/>
  <line x1="120" y1="293" x2="120" y2="307" stroke="#6b6b66" stroke-width="1"/>
  <line x1="620" y1="293" x2="620" y2="307" stroke="#6b6b66" stroke-width="1"/>
  <text x="370" y="290" font-family="monospace" font-size="14" fill="#6b6b66" text-anchor="middle">L = 300 mm</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
</svg>
