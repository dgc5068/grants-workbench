<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#fbfbf7"/>
  <rect x="10" y="10" width="780" height="400" fill="none" stroke="#1b1b18" stroke-width="1.5"/>
  <rect x="700" y="330" width="80" height="70" fill="none" stroke="#1b1b18" stroke-width="1"/>
  <text x="740" y="355" font-family="monospace" font-size="13" fill="#1b1b18" text-anchor="middle">FIG. 02</text>
  <text x="740" y="375" font-family="monospace" font-size="10" fill="#6b6b66" text-anchor="middle">BRACKET MESH</text>
  <text x="740" y="392" font-family="monospace" font-size="10" fill="#6b6b66" text-anchor="middle">PLA · 3 mm EL</text>

  <!-- L-bracket silhouette -->
  <path d="M 150 90 L 150 340 L 560 340 L 560 280 L 210 280 L 210 90 Z"
        fill="none" stroke="#1b1b18" stroke-width="2.5"/>

  <!-- mesh lines -->
  <g stroke="#6b6b66" stroke-width="0.8" opacity="0.8">
    <line x1="150" y1="140" x2="210" y2="140"/>
    <line x1="150" y1="190" x2="210" y2="190"/>
    <line x1="150" y1="240" x2="210" y2="240"/>
    <line x1="150" y1="140" x2="210" y2="190"/>
    <line x1="150" y1="190" x2="210" y2="240"/>
    <line x1="150" y1="240" x2="210" y2="280"/>
    <line x1="210" y1="280" x2="560" y2="340" opacity="0"/>
    <line x1="260" y1="280" x2="260" y2="340"/>
    <line x1="320" y1="280" x2="320" y2="340"/>
    <line x1="390" y1="280" x2="390" y2="340"/>
    <line x1="460" y1="280" x2="460" y2="340"/>
    <line x1="520" y1="280" x2="520" y2="340"/>
    <line x1="210" y1="280" x2="260" y2="340"/>
    <line x1="260" y1="280" x2="320" y2="340"/>
    <line x1="320" y1="280" x2="390" y2="340"/>
    <line x1="390" y1="280" x2="460" y2="340"/>
    <line x1="460" y1="280" x2="520" y2="340"/>
    <line x1="210" y1="340" x2="260" y2="280"/>
    <line x1="260" y1="340" x2="320" y2="280"/>
    <line x1="320" y1="340" x2="390" y2="280"/>
    <line x1="390" y1="340" x2="460" y2="280"/>
    <line x1="460" y1="340" x2="520" y2="280"/>
  </g>

  <!-- fillet stress concentration highlight -->
  <path d="M 210 280 Q 235 280 235 305" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <circle cx="228" cy="290" r="4" fill="#1d4ed8"/>
  <text x="250" y="265" font-family="monospace" font-size="14" fill="#1d4ed8">σ<tspan dy="4" font-size="10">max</tspan><tspan dy="-4"> ≈ 41 MPa</tspan></text>
  <line x1="250" y1="272" x2="230" y2="288" stroke="#1d4ed8" stroke-width="1"/>

  <!-- mounting holes -->
  <circle cx="180" cy="120" r="11" fill="none" stroke="#1b1b18" stroke-width="2"/>
  <circle cx="180" cy="120" r="4" fill="none" stroke="#1b1b18" stroke-width="1"/>
  <text x="205" y="125" font-family="monospace" font-size="12" fill="#6b6b66">Ø8 THRU</text>

  <!-- fixed support hatch -->
  <line x1="150" y1="340" x2="560" y2="340" stroke="#1b1b18" stroke-width="3"/>
  <line x1="160" y1="340" x2="140" y2="360" stroke="#1b1b18" stroke-width="1"/>
  <line x1="200" y1="340" x2="180" y2="360" stroke="#1b1b18" stroke-width="1"/>
  <line x1="240" y1="340" x2="220" y2="360" stroke="#1b1b18" stroke-width="1"/>
  <line x1="280" y1="340" x2="260" y2="360" stroke="#1b1b18" stroke-width="1"/>
  <line x1="320" y1="340" x2="300" y2="360" stroke="#1b1b18" stroke-width="1"/>
  <line x1="360" y1="340" x2="340" y2="360" stroke="#1b1b18" stroke-width="1"/>
</svg>
